<!doctype html>
<!-- 공 여러 개로 미로형 벽돌밭을 갉아먹는 세로형 벽돌깨기 홈 화면 웹앱 (난이도·자동 진행 포함) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Core Drill</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Core Drill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1b1b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#1b1b1b;
    --card:#232323;
    --line:#333333;
    --ink:#f2f2f2;
    --dim:#9a9a9a;
    --green:#6cc02f;
    --paddle:#f4845f;
    --on:#34c759;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;}
  body{
    position:fixed;inset:0;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    position:absolute;top:0;bottom:0;left:50%;
    transform:translateX(-50%);
    width:min(100vw, 60dvh);
    overflow:hidden;
    touch-action:none;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .probe{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

  /* ── HUD ───────────────────────────────── */
  .hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 0;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    pointer-events:none;
  }
  .hud .left{display:flex;flex-direction:column;gap:3px;}
  .score{font-family:Silkscreen,ui-monospace,monospace;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;}
  .meta{font-size:11px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;}
  .hud .right{display:flex;align-items:center;gap:10px;}
  .lives{display:flex;gap:3px;}
  .lives i{width:6px;height:11px;border-radius:1px;background:var(--paddle);display:block;}
  .lives i.out{background:#3a3a3a;}
  /* 수동·자동 전환 버튼: 게임 중에 한 번 눌러 바로 바꾼다 */
  .auto-btn{
    pointer-events:auto;appearance:none;
    height:32px;min-width:72px;padding:0 10px;border-radius:8px;
    border:1px solid #444;background:rgba(255,255,255,.04);color:var(--dim);
    font:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;
  }
  .auto-btn.on{border-color:#2f7d2f;background:#1d4d1d;color:#8fe08f;}
  /* 벙커버스터 발사 버튼: 오른손 엄지로 패들을 끄는 동안 왼손 엄지로 쏘도록 왼쪽 아래 */
  .missile-btn{
    position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);
    appearance:none;
    width:60px;height:60px;border-radius:50%;
    border:3px solid #1b1b1b;background:#ffc400;color:#1b1b1b;
    font:inherit;font-size:20px;font-weight:900;line-height:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
    animation:armed 1s ease-in-out infinite;
  }
  .missile-btn span{font-size:12px;}
  .missile-btn[hidden]{display:none;}
  @keyframes armed{ 50%{ box-shadow:0 4px 14px rgba(0,0,0,.5), 0 0 0 7px rgba(255,196,0,.35); } }
  @media (prefers-reduced-motion: reduce){ .missile-btn{ animation:none; } }
  .icon-btn{
    pointer-events:auto;appearance:none;
    width:40px;height:40px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--ink);font:inherit;font-size:14px;font-weight:700;letter-spacing:-.05em;
    display:grid;place-items:center;padding:0;
  }

  /* ── 메뉴 ──────────────────────────────── */
  .panel{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    padding:16px;box-sizing:border-box;
    background:rgba(10,10,10,.72);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .panel.show{display:flex;}
  .card{
    width:100%;max-width:330px;box-sizing:border-box;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:24px 18px 18px;
  }
  .title{font-family:Silkscreen,ui-monospace,monospace;font-size:32px;line-height:1;text-align:center;letter-spacing:.02em;}
  .title em{font-style:normal;color:var(--green);}
  .sub{text-align:center;color:var(--dim);font-size:14px;margin-top:10px;min-height:1.2em;}
  .row{margin-top:20px;}
  .row-label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px;}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#1a1a1a;border-radius:11px;padding:4px;}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:15px;padding:10px 0;border-radius:8px;}
  .seg button[aria-pressed="true"]{background:#3c3c3c;color:var(--ink);font-weight:600;}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid #2e2e2e;font-size:15px;}
  .toggle small{display:block;color:var(--dim);font-size:12px;margin-top:2px;}
  .switch{appearance:none;flex:none;position:relative;width:51px;height:31px;border:0;border-radius:16px;background:#3a3a3a;padding:0;transition:background .2s;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;}
  .switch[aria-checked="true"]{background:var(--on);}
  .switch[aria-checked="true"]::after{transform:translateX(20px);}
  .primary,.secondary{
    display:block;width:100%;appearance:none;font:inherit;font-size:17px;font-weight:700;
    padding:14px 0;border-radius:13px;
  }
  .primary{margin-top:14px;border:0;background:var(--paddle);color:#1b1b1b;}
  .secondary{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--ink);}
  .secondary[hidden]{display:none;}
  .best{text-align:center;color:var(--dim);font-size:12px;margin-top:12px;font-variant-numeric:tabular-nums;}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" aria-label="벽돌깨기 게임 화면"></canvas>
  <div class="probe" id="probe"></div>

  <div class="hud">
    <div class="left">
      <div class="score" id="score">0</div>
      <div class="meta">LV <span id="level">1</span> · 공 <span id="ballCount">1</span></div>
    </div>
    <div class="right">
      <button class="auto-btn" id="autoBtn" type="button" aria-label="수동·자동 전환">MANUAL</button>
      <span class="lives" id="lives"></span>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="일시정지">II</button>
    </div>
  </div>

  <button class="missile-btn" id="missileBtn" type="button" aria-label="벙커버스터 발사" hidden>▼<span>×<b id="missileCount">1</b></span></button>

  <div class="panel show" id="panel">
    <div class="card">
      <div class="title">CORE<em>DRILL</em></div>
      <div class="sub" id="panelSub">공으로 초록 벽돌밭을 갉아먹어요</div>
      <div class="row">
        <div class="row-label"><span>난이도</span><span id="diffNote"></span></div>
        <div class="seg" id="diffSeg">
          <button type="button" data-d="easy">쉬움</button>
          <button type="button" data-d="normal">보통</button>
          <button type="button" data-d="hard">어려움</button>
        </div>
      </div>
      <div class="row">
        <div class="toggle">
          <div>자동 진행<small>AI가 대신 플레이해요</small></div>
          <button class="switch" id="autoSw" type="button" role="switch" aria-label="자동 진행"></button>
        </div>
        <div class="toggle">
          <div>소리</div>
          <button class="switch" id="soundSw" type="button" role="switch" aria-label="소리"></button>
        </div>
        <div class="toggle">
          <div>진동<small>아이폰은 iOS 18 이상</small></div>
          <button class="switch" id="hapticSw2" type="button" role="switch" aria-label="진동"></button>
        </div>
      </div>
      <button class="primary" id="primaryBtn" type="button">시작</button>
      <button class="secondary" id="secondaryBtn" type="button" hidden>새 게임</button>
      <div class="best" id="bestLine"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ── 상수 ────────────────────────────────────────────────
  const W = 360;
  let CELL = 12, COLS = W / CELL;             // 칸 크기는 레벨 단계마다 바뀐다 (buildLevel)
  const EMPTY = 0, GREEN = 1, WALL = 2;
  const BALL_R = 3.6, MAX_BALLS = 300, PADDLE_H = 9;
  const ITEM_R = 10, ITEM_SPEED = 120;
  const CLEAR_AT = 1;                       // 초록 칸을 전부 깨야 클리어
  const lastN = () => Math.max(10, Math.ceil(totalGreen * 0.03));   // 이만큼 남으면 막판 표시
  const AUTO_SPEED = 820;                   // 자동 진행 패들 최고 속도(px/s)

  const DIFF = {
    easy:   { name:"쉬움",   speed:250, paddle:92, lives:5, bad:0.12, drop:0.07 },
    normal: { name:"보통",   speed:300, paddle:74, lives:3, bad:0.22, drop:0.06 },
    hard:   { name:"어려움", speed:360, paddle:60, lives:2, bad:0.34, drop:0.05 }
  };
  const COL = {
    bg:"#1b1b1b", green:"#4c9a1c", greenLine:"#2f6512", wall:"#8d8d8d", wallLine:"#5f5f5f",
    ball:"#f7f7f7", pierce:"#f2b8ee", paddle:"#f4845f", track:"#3a3a3a", bar:"#e8174f", dim:"#9a9a9a"
  };
  const ITEMS = {
    plus3:  { color:"#1fb6d9", good:true },
    wide:   { color:"#1d8a1d", good:true },
    pierce: { color:"#e7b5e6", good:true },
    laser:  { color:"#e53935", good:true },
    missile:{ color:"#ffc400", good:true },
    mega:   { color:"#ff4fa3", good:true },
    shrink: { color:"#f79a63", good:false }
  };
  const SHOT_SPEED = 620, SHOT_GAP = 0.18;  // 레이저 총알 속도(px/s)와 발사 간격(s)
  const MEGA_R = 13, MEGA_TIME = 10;        // 왕볼 반지름(px)과 지속 시간(s)

  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ── 저장 ────────────────────────────────────────────────
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  const settings = Object.assign({ diff:"normal", auto:false, sound:true, haptic:true }, store.get("coredrill.settings", {}));
  if (!DIFF[settings.diff]) settings.diff = "normal";
  const saveSettings = () => store.set("coredrill.settings", settings);
  const bestOf = d => store.get("coredrill.best." + d, 0) || 0;
  // 난이도별로 도달한 레벨(클리어한 레벨 + 1). 다시 켜면 여기서부터 이어 한다
  const reachedOf = d => Math.max(1, store.get("coredrill.level." + d, 1) || 1);

  // ── 사운드 ──────────────────────────────────────────────
  let actx = null, lastBlip = 0;
  function audio(){
    if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function blip(freq, dur, type, vol){
    if (!settings.sound) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (dur || 0.05));
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + (dur || 0.05) + 0.01);
  }
  // 공이 많을 때 벽돌 소리가 겹치지 않게 간격을 둔다
  function brickBlip(){
    const now = performance.now();
    if (now - lastBlip < 40) return;
    lastBlip = now;
    // 콤보가 쌓일수록 음이 올라간다
    blip(360 * Math.pow(2, Math.min(combo, 60) / 30) * (0.95 + Math.random() * 0.1), 0.03, "square", 0.025);
  }

  // ── 난수 ────────────────────────────────────────────────
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ── 화면 배치 ───────────────────────────────────────────
  const stage = $("stage"), cvs = $("game"), ctx = cvs.getContext("2d");
  const field = document.createElement("canvas"), fctx = field.getContext("2d");
  let H = 640, k = 1, safeTop = 0, safeBot = 0, TOP = 60, PADDLE_Y = 560;
  let ROWS = 30, grid = new Uint8Array(COLS * ROWS);

  function layout(){
    // 페이지가 뜨는 순간 크기가 0일 수 있어 기본값을 둔다
    const cw = stage.clientWidth || W, ch = stage.clientHeight || 640;
    const scale = cw / W;
    H = ch / scale;
    k = Math.min(window.devicePixelRatio || 1, 3) * scale;
    cvs.width = Math.round(W * k); cvs.height = Math.round(H * k);
    const cs = getComputedStyle($("probe"));
    safeTop = (parseFloat(cs.paddingTop) || 0) / scale;
    safeBot = (parseFloat(cs.paddingBottom) || 0) / scale;
    TOP = safeTop + 58;
    PADDLE_Y = H - safeBot - 58;
    paintField();
  }
  const rowsFor = () => Math.floor(clamp(PADDLE_Y - 200 - TOP, 22 * 12, 46 * 12) / CELL);

  // ── 상태 ────────────────────────────────────────────────
  let balls = [], drops = [], parts = [], shots = [];
  const paddle = { x: W / 2, w: 74, target: W / 2 };
  let game = { diff: settings.diff }, D = DIFF[game.diff];
  let score = 0, level = 1, lives = 3, totalGreen = 1, broken = 0, assisted = false;
  let state = "menu";               // menu | ready | play | pause | clear | over
  let resumeTo = "play", pausedByHide = false;
  let sizeMul = 1, sizeT = 0, pierceT = 0, laserT = 0, shotT = 0, shake = 0;
  let timer = 0;                    // ready·clear·over 상태에서 쓰는 시간
  let idleT = 0;                    // 마지막으로 벽돌을 깬 뒤 지난 시간
  // 러시: 한 스테이지가 2분을 넘기면 강한 무기를 쏟아부어 빨리 끝낸다
  const RUSH_AT = 120, FINAL_AT = 150;
  let levelT = 0, rush = 0, rushT = 0;
  let missedThisLevel = false, clearGain = 0;   // 스피드·노미스 클리어 보너스 계산용
  let gems = [], gemOf = new Map();             // 벽돌밭에 박힌 아이템과, 칸 번호 → 아이템
  // 연출: 튀어나오는 글자, 퍼지는 링, 깨진 칸 번쩍임, 클리어 연쇄 폭발
  let pops = [], rings = [], flashes = [], sweep = [], sweepRate = 0, redFlash = 0, boomFlash = 0;
  // 벙커버스터: 모아 뒀다가 버튼으로 쏘는 미사일
  const MISSILE_MAX = 3, BLAST_PX = 78, SEC_PX = 31;   // 주 폭발·2차 폭발 반경(px), 해상도가 바뀌어도 위력이 같다
  let missiles = 0, strike = null;
  let combo = 0, comboT = 0, comboIdx = 0, milestone = 0;
  const COMBO_STEPS = [10, 25, 50, 100, 200, 300, 500, 1000];
  const BALL_STEPS = [10, 25, 50, 100, 200];
  const CONFETTI = ["#ff5a5f", "#ffd23f", "#3ec1d3", "#9b5de5", "#6cc02f", "#ff8c42"];
  let keyL = false, keyR = false;

  // ── 레벨 단계: 레벨이 오를수록 칸이 작아지고(해상도 상승) 보상이 커진다 ──
  const TIERS = [
    { from: 1,  cell: 12, title: "CLEAR!" },
    { from: 3,  cell: 10, title: "GREAT!" },
    { from: 5,  cell: 9,  title: "EXCELLENT!" },
    { from: 7,  cell: 8,  title: "AMAZING!" },
    { from: 10, cell: 6,  title: "LEGENDARY!" }
  ];
  const tierOf = lv => { let t = 0; TIERS.forEach((s, i) => { if (lv >= s.from) t = i; }); return t; };
  let tier = 0;
  const scoreMul = () => 1 + tier * 0.5;          // 점수 배율 ×1.0 ~ ×3.0

  // ── 맵 종류: 1~5레벨은 차례로, 그 뒤는 무작위(같은 맵 연속 없음) ──
  const MAPS = ["corridors", "full", "slits", "vault", "pyramid", "maze", "rings"];
  const MAP_NAME = { corridors: "TUNNELS", full: "FULL FIELD", slits: "SLITS", vault: "VAULT", pyramid: "PYRAMID", maze: "MAZE", rings: "TARGET" };
  // 맵별 벽돌 색. edge가 있으면 벽에 닿은 벽돌 칸을 그 색으로 칠해 테두리처럼 보이게 한다
  const PALETTES = {
    green: { brick: "#4c9a1c", line: "#2f6512", spark: "#b8f27c" },
    red:   { brick: "#d4202c", line: "#8a121a", spark: "#ff8a8a", edge: "#7cff1f", edgeLine: "#3f8f0c" }
  };
  let pal = PALETTES.green;
  function mapFor(lv){
    if (lv <= MAPS.length) return MAPS[lv - 1];
    let k = Math.floor(mulberry32(lv * 977 + 3)() * MAPS.length);
    if (MAPS[k] === mapFor(lv - 1)) k = (k + 1) % MAPS.length;
    return MAPS[k];
  }
  let mapKind = "corridors";

  // 통로·방 맵: 12px 단위 거친 격자에서 만든 뒤 지금 해상도로 옮긴다
  function genCorridors(cols, rows, rnd, lv){
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const N = cols * rows, g = new Uint8Array(N).fill(GREEN), carve = new Uint8Array(N);
    const mark = (x, y) => { if (x >= 1 && x < cols - 1 && y >= 1 && y < rows) carve[y * cols + x] = 1; };
    const block = (x, y) => { mark(x, y); mark(x + 1, y); mark(x, y + 1); mark(x + 1, y + 1); };
    const D4 = [[0,-1],[1,0],[0,1],[-1,0]];
    // 통로: 바닥에서 시작해 꺾이며 올라가는 폭 2칸 길
    const corridors = 1 + Math.min(2, Math.ceil(lv / 2));
    for (let c = 0; c < corridors; c++){
      let x = ri(3, cols - 5), y = rows - 2, dir = 0;
      const segs = ri(3, 6);
      for (let s = 0; s < segs; s++){
        const len = dir === 0 ? ri(5, 11) : ri(4, 10);
        for (let i = 0; i < len; i++){
          block(x, y);
          const nx = x + D4[dir][0], ny = y + D4[dir][1];
          if (nx < 2 || nx > cols - 4 || ny < 3) break;
          x = nx; y = ny;
        }
        dir = dir === 0 ? (rnd() < 0.5 ? 1 : 3) : 0;
      }
    }
    // 방: 벽으로 둘러싼 빈 사각형
    const rooms = ri(1, 2) + (lv > 3 ? 1 : 0);
    for (let r = 0; r < rooms; r++){
      const w = ri(6, 12), h = ri(4, 7);
      const x0 = ri(3, cols - 4 - w), y0 = ri(3, Math.max(3, rows - 10 - h));
      for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) mark(x, y);
    }
    // 판 곳 둘레를 벽으로
    for (let i = 0; i < N; i++){
      if (carve[i]) continue;
      const x = i % cols, y = (i / cols) | 0;
      search: for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || xx >= cols || yy < 0 || yy >= rows) continue;
        if (carve[yy * cols + xx]){ g[i] = WALL; break search; }
      }
    }
    for (let i = 0; i < N; i++) if (carve[i]) g[i] = EMPTY;
    // 벽 틈: 벽을 점선처럼 2칸씩 끊어 벽 뒤 초록 칸이 갇히지 않게 한다
    for (let i = 0; i < N; i++){
      if (g[i] !== WALL || rnd() >= 0.18) continue;
      g[i] = GREEN;
      if (i % cols + 1 < cols && g[i + 1] === WALL) g[i + 1] = GREEN;
      else if (i + cols < N && g[i + cols] === WALL) g[i + cols] = GREEN;
    }
    return g;
  }

  // 미로: 36px 칸의 미로를 만들고, 막다른 길이 너무 많지 않게 벽 일부를 튼다
  function genMaze(rnd, FH){
    const M = 36, mw = Math.floor(W / M), mh = Math.max(4, Math.floor(FH / M));
    const vW = [], hW = [];                        // vW[y][x]: 칸 왼쪽 벽, hW[y][x]: 칸 위쪽 벽
    for (let y = 0; y <= mh; y++){ vW.push(new Array(mw + 1).fill(1)); hW.push(new Array(mw).fill(1)); }
    const seen = Array.from({ length: mh }, () => new Array(mw).fill(false));
    const stack = [[Math.floor(rnd() * mw), mh - 1]];
    seen[mh - 1][stack[0][0]] = true;
    while (stack.length){
      const [x, y] = stack[stack.length - 1];
      const opts = [[0,-1],[1,0],[0,1],[-1,0]].filter(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return nx >= 0 && nx < mw && ny >= 0 && ny < mh && !seen[ny][nx];
      });
      if (!opts.length){ stack.pop(); continue; }
      const [dx, dy] = opts[Math.floor(rnd() * opts.length)];
      if (dx === 1) vW[y][x + 1] = 0; else if (dx === -1) vW[y][x] = 0;
      else if (dy === 1) hW[y + 1][x] = 0; else hW[y][x] = 0;
      seen[y + dy][x + dx] = true;
      stack.push([x + dx, y + dy]);
    }
    for (let y = 1; y < mh; y++) for (let x = 0; x < mw; x++) if (rnd() < 0.3) hW[y][x] = 0;
    for (let y = 0; y < mh; y++) for (let x = 1; x < mw; x++) if (rnd() < 0.3) vW[y][x] = 0;
    for (let x = 0; x < mw; x++) hW[mh][x] = rnd() < 0.45 ? 0 : 1;    // 바닥 입구 여러 곳
    const T = Math.max(CELL, 5);
    return (px, py) => {
      const mx = Math.floor(px / M), my = Math.floor(py / M);
      if (my >= mh) return py - mh * M < T && hW[mh][Math.min(mx, mw - 1)] ? WALL : GREEN;
      const lx = px - mx * M, ly = py - my * M;
      if (lx < T && ly < T) return WALL;
      if (lx < T && vW[my][Math.min(mx, mw)]) return WALL;
      if (ly < T && hW[my][Math.min(mx, mw - 1)]) return WALL;
      return GREEN;
    };
  }

  // 좁은 틈: 두꺼운 회색 띠가 가로막고, 띠마다 길고 좁은 세로 틈(초록으로 찬 굴)이 몇 개 있다
  function genSlits(rnd, FH){
    const bands = FH > 380 ? 3 : 2, T = 54;
    const w = Math.max(1, Math.round(10 / CELL));          // 틈 폭은 약 10~12px (칸 수)
    const list = [];
    for (let b = 0; b < bands; b++){
      const y0 = Math.round(FH * (b + 1) / (bands + 1) - T / 2);
      const cols = [], n = 2 + Math.floor(rnd() * 2);
      for (let k = 0; k < n; k++) cols.push(Math.floor((24 + rnd() * (W - 48)) / CELL));
      list.push({ y0, cols });
    }
    return (px, py) => {
      const cx = Math.floor(px / CELL);
      for (const b of list){
        if (py < b.y0 || py >= b.y0 + T) continue;
        return b.cols.some(c => cx >= c && cx < c + w) ? GREEN : WALL;
      }
      return GREEN;
    };
  }

  // 금고: 바닥은 막혀 있고 왼쪽의 길고 좁은 세로 통로 두 개로 들어간다.
  // 가운데 가로 통로가 두 번째 세로 통로와 금고를 잇고, 금고 안에는 작은 블록이 두 줄로 놓여 있다
  function genVault(rnd, FH){
    const snap = v => Math.round(v / CELL) * CELL;
    const T = Math.max(CELL, 6), cw = Math.max(CELL, 12), f = CELL;          // 벽 두께, 통로 폭, 바깥 테두리
    const c1 = f, w1 = c1 + cw, c2 = w1 + T, w2 = c2 + cw, room = w2 + T;   // 세로 통로·벽의 x 경계
    const midY = snap(FH * 0.5);                                              // 가로 통로 위치
    const vx0 = snap(W * 0.45), vx1 = snap(W * 0.64), vy0 = snap(FH * 0.3), vy1 = snap(FH * 0.72);
    const pcx = [vx0 + (vx1 - vx0) * 0.35, vx0 + (vx1 - vx0) * 0.65];
    const gaps = [snap(room + 20 + rnd() * (W / 2 - room)), snap(W / 2 + rnd() * (W / 2 - 40))];   // 바닥 벽의 작은 틈 두 곳
    const inX = (px, a, b) => px >= a && px < b;
    return (px, py) => {
      if (py >= FH - T){                                                       // 바닥 벽
        if (inX(px, c1, w1) || inX(px, c2, w2)) return EMPTY;
        return gaps.some(g => inX(px, g, g + cw)) ? GREEN : WALL;
      }
      if (py < f + T) return GREEN;                                            // 맨 위 띠: 세로 통로 꼭대기와 방을 잇는다
      if (inX(px, c1, w1) || inX(px, c2, w2)) return EMPTY;                    // 세로 통로
      if (inX(px, w1, c2)) return WALL;
      if (inX(px, w2, room)) return py >= midY && py < midY + cw ? EMPTY : WALL;
      if (py >= midY && py < midY + cw && px < vx0 + T) return EMPTY;           // 가로 통로 (금고 왼쪽 벽까지 뚫는다)
      if (px < vx0 && ((py >= midY - T && py < midY) || (py >= midY + cw && py < midY + cw + T))) return WALL;
      if (inX(px, vx0, vx1) && py >= vy0 && py < vy1){                          // 금고
        const inner = px >= vx0 + T && px < vx1 - T && py >= vy0 + T && py < vy1 - T;
        if (!inner){
          const corner = (px < vx0 + T || px >= vx1 - T) && (py < vy0 + T || py >= vy1 - T);
          return corner ? GREEN : WALL;                                         // 모서리는 깰 수 있다
        }
        const ry = ((py - vy0 - T) % 24) - 12;
        return pcx.some(cx => Math.abs(px - cx) < 6) && Math.abs(ry) < 6 ? GREEN : EMPTY;
      }
      return GREEN;
    };
  }

  // 피라미드: 바닥이 넓은 계단식, 층 사이에는 점선 회색 띠
  function pyramidAt(px, py, FH){
    const S = 24, layers = Math.max(4, Math.floor(FH * 0.95 / S));
    const k = Math.floor((FH - py) / S);
    if (k >= layers) return EMPTY;
    const half = (W / 2 - 12) * (1 - k / layers);
    if (Math.abs(px - W / 2) > half) return EMPTY;
    const top = FH - (k + 1) * S;
    if (k > 0 && py - top < Math.max(CELL, 5) && (Math.floor(px / 24) + k) % 3 !== 0) return WALL;
    return GREEN;
  }

  // 과녁: 이어진 동심원 회색 고리마다 출입구가 몇 군데 뚫려 있다
  function ringsAt(px, py, FH){
    const cx = W / 2, cy = FH * 0.45, B = 36, T = Math.max(CELL * 1.5, 8);
    const dx = px - cx, dy = py - cy, r = Math.hypot(dx, dy), k = Math.floor(r / B);
    if (k >= 1 && r - k * B < T){
      const a = (Math.atan2(dy, dx) + Math.PI) / (Math.PI * 2);
      const doors = 2 + k;                                  // 바깥 고리일수록 출입구가 많다
      if ((a * doors + k * 0.37) % 1 > 0.1) return WALL;
    }
    return GREEN;
  }

  // ── 박힌 아이템: 공이 그 칸까지 파고들어 깨야 풀려나는 "과실" (칸 하나, 아이템 색) ──
  // 깊이별로 고르게 퍼뜨리고, 깊은(위쪽) 자리일수록 센 아이템을 둔다
  // 패들 늘리기(진한 초록)는 초록 칸 사이에서 안 보여서 넣지 않는다
  const GEM_KINDS = ["missile", "mega", "laser", "plus3", "pierce", "plus3", "laser", "mega", "pierce", "plus3"];
  function placeGems(rnd){
    gems = []; gemOf = new Map();
    // 바닥 15%를 뺀 높이를 깊이별 띠 n개로 나누고, 띠마다 무작위 자리 하나 (가장 위 띠가 가장 깊다)
    const n = 5 + tier, FH = ROWS * CELL, band = FH * 0.85 / n;
    for (let k = 0; k < n; k++){
      const cand = [];
      for (let i = 0; i < grid.length; i++){
        if (grid[i] !== GREEN) continue;
        const y = (((i / COLS) | 0) + 0.5) * CELL;
        if (y >= k * band && y < (k + 1) * band) cand.push(i);
      }
      for (let tries = 0; tries < 30 && cand.length; tries++){
        const i = cand[Math.floor(rnd() * cand.length)];
        const x = (i % COLS + 0.5) * CELL, y = (((i / COLS) | 0) + 0.5) * CELL;
        if (gems.some(g => Math.hypot(g.x - x, g.ly - y) < 48)) continue;
        let kind = GEM_KINDS[k % GEM_KINDS.length];
        if (pal === PALETTES.red && kind === "laser") kind = "plus3";   // 빨간 벽돌에선 레이저 색이 안 보인다
        const g = { x, ly: y, kind, taken: false };
        gems.push(g);
        gemOf.set(i, g);
        break;
      }
    }
  }

  function buildLevel(lv){
    tier = tierOf(lv);
    CELL = TIERS[tier].cell; COLS = W / CELL;
    ROWS = rowsFor();
    const N = COLS * ROWS, FH = ROWS * CELL;
    grid = new Uint8Array(N);
    const rnd = mulberry32(lv * 2654435761 + 7);
    mapKind = mapFor(lv);
    pal = mapKind === "vault" ? PALETTES.red : PALETTES.green;

    if (mapKind === "corridors"){
      const cr = Math.ceil(FH / 12), g = genCorridors(30, cr, rnd, lv);
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
        grid[y * COLS + x] = g[Math.min(cr - 1, Math.floor((y + 0.5) * CELL / 12)) * 30 + Math.floor((x + 0.5) * CELL / 12)];
      }
    } else {
      const at = mapKind === "maze" ? genMaze(rnd, FH)
        : mapKind === "slits" ? genSlits(rnd, FH)
        : mapKind === "vault" ? genVault(rnd, FH)
        : mapKind === "pyramid" ? (px, py) => pyramidAt(px, py, FH)
        : mapKind === "rings" ? (px, py) => ringsAt(px, py, FH)
        : () => GREEN;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
        grid[y * COLS + x] = at((x + 0.5) * CELL, (y + 0.5) * CELL);
      }
    }

    // 테두리: 왼쪽·오른쪽·위 (아래는 열려 있다)
    for (let y = 0; y < ROWS; y++){ grid[y * COLS] = WALL; grid[y * COLS + COLS - 1] = WALL; }
    for (let x = 0; x < COLS; x++) grid[x] = WALL;

    // 바닥에서 닿지 않는 초록 칸은 비운다
    const D4 = [[0,-1],[1,0],[0,1],[-1,0]];
    const seen = new Uint8Array(N), queue = [];
    for (let x = 0; x < COLS; x++){
      const i = (ROWS - 1) * COLS + x;
      if (grid[i] !== WALL){ seen[i] = 1; queue.push(i); }
    }
    while (queue.length){
      const i = queue.pop(), x = i % COLS, y = (i / COLS) | 0;
      for (const [dx, dy] of D4){
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || xx >= COLS || yy < 0 || yy >= ROWS) continue;
        const j = yy * COLS + xx;
        if (!seen[j] && grid[j] !== WALL){ seen[j] = 1; queue.push(j); }
      }
    }
    totalGreen = 0;
    for (let i = 0; i < N; i++){
      if (grid[i] === GREEN && !seen[i]) grid[i] = EMPTY;
      if (grid[i] === GREEN) totalGreen++;
    }
    broken = 0; milestone = 0;
    levelT = 0; rush = 0; rushT = 0; missedThisLevel = false;
    placeGems(rnd);
    paintField();
  }

  // ── 벽돌밭 그리기 (바뀐 칸만 다시 그린다) ──────────────
  function paintCell(i){
    const x = (i % COLS) * CELL, y = ((i / COLS) | 0) * CELL, v = grid[i];
    fctx.clearRect(x, y, CELL, CELL);
    if (v === EMPTY) return;
    const gem = v === GREEN && gemOf.get(i);          // 박힌 아이템 칸은 아이템 색으로만 칠한다
    const edge = v === GREEN && pal.edge && touchesWall(i);
    fctx.fillStyle = v === WALL ? COL.wallLine : edge ? pal.edgeLine : pal.line;
    fctx.fillRect(x, y, CELL, CELL);
    fctx.fillStyle = v === WALL ? COL.wall : gem && !gem.taken ? ITEMS[gem.kind].color : edge ? pal.edge : pal.brick;
    fctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    fctx.fillStyle = "rgba(255,255,255,.10)";
    fctx.fillRect(x + 1, y + 1, CELL - 2, 1.5);
  }
  function touchesWall(i){
    const x = i % COLS;
    return (x > 0 && grid[i - 1] === WALL) || (x < COLS - 1 && grid[i + 1] === WALL)
      || (i >= COLS && grid[i - COLS] === WALL) || (i + COLS < grid.length && grid[i + COLS] === WALL);
  }
  function paintField(){
    field.width = Math.round(W * k); field.height = Math.round(ROWS * CELL * k);
    fctx.setTransform(k, 0, 0, k, 0, 0);
    for (let i = 0; i < grid.length; i++) paintCell(i);
  }

  // ── 연출 도우미 ─────────────────────────────────────────
  const fieldMidY = () => TOP + ROWS * CELL * 0.5;
  function pop(text, x, y, size, color, life){
    if (pops.length > 8) pops.shift();
    pops.push({ text, x, y, size: size || 26, color: color || "#ffffff", t: 0, life: life || 1.1 });
  }
  function ring(x, y, color, max){ rings.push({ x, y, color, max: max || 60, t: 0 }); }
  function fanfare(notes, gap){
    notes.forEach((f, j) => setTimeout(() => blip(f, 0.16, "triangle", 0.05), j * (gap || 90)));
  }
  // 불꽃놀이: 정해진 시간차로 여러 발을 터뜨린다 (x, y를 주면 그 근처에서)
  let fwQueue = [];
  function fireworks(n, x, y){
    for (let j = 0; j < n; j++) fwQueue.push({ at: j * 0.18 + Math.random() * 0.08, x, y });
  }
  function spawnFirework(x, y){
    x = x == null ? W * (0.15 + Math.random() * 0.7) : clamp(x + (Math.random() - .5) * 120, 30, W - 30);
    y = y == null ? TOP + 30 + Math.random() * ROWS * CELL * 0.7 : y + (Math.random() - .5) * 100;
    const c1 = CONFETTI[(Math.random() * CONFETTI.length) | 0], c2 = CONFETTI[(Math.random() * CONFETTI.length) | 0];
    const v0 = 120 + Math.random() * 60;
    for (let j = 0; j < 36 && parts.length < 1100; j++){
      const a = j / 36 * Math.PI * 2;
      parts.push({ x, y, vx: Math.cos(a) * v0, vy: Math.sin(a) * v0, t: 0, life: .9 + Math.random() * .4,
        c: j % 3 ? c1 : c2, s: 2.5, g: 90, drag: true });
    }
    ring(x, y, c1, 40);
    blip(1300 + Math.random() * 500, 0.04, "square", 0.03);
    blip(150, 0.15, "sawtooth", 0.04);
  }
  // 진동: 안드로이드는 vibrate, 아이폰(iOS 18+)은 숨긴 스위치 체크박스를 눌러 햅틱을 낸다
  const hapticLabel = (() => {
    try {
      const inp = document.createElement("input");
      inp.type = "checkbox"; inp.id = "hapticSw"; inp.setAttribute("switch", "");
      inp.style.display = "none";
      const lab = document.createElement("label");
      lab.htmlFor = "hapticSw"; lab.style.display = "none";
      document.body.append(inp, lab);
      return lab;
    } catch(e){ return null; }
  })();
  function haptic(n){
    if (!settings.haptic) return;
    if (navigator.vibrate){ navigator.vibrate(Array.from({ length: n * 2 - 1 }, (_, j) => j % 2 ? 60 : 40)); return; }
    for (let j = 0; j < n; j++) setTimeout(() => hapticLabel && hapticLabel.click(), j * 90);
  }
  function announceLevel(){
    pop("LEVEL " + level, W / 2, fieldMidY() - 30, 30, "#ffffff", 1.8);
    pop(MAP_NAME[mapKind], W / 2, fieldMidY() + 4, 18, "#6cc02f", 1.8);
    if (level > 1) pop("SPEED +" + Math.round(speedUp() * 100) + "%  ·  SCORE ×" + scoreMul().toFixed(1), W / 2, fieldMidY() + 32, 13, "#ffd23f", 1.8);
    // 해상도가 올라가는 레벨: 목숨 +1, 벙커버스터 +1
    if (level > 1 && tierOf(level - 1) < tier){
      lives = Math.min(D.lives + 2, lives + 1);
      missiles = Math.min(MISSILE_MAX, missiles + 1);
      pop("RESOLUTION UP!", W / 2, fieldMidY() - 64, 22, "#ff4fa3", 2.2);
      pop("+1 LIFE  ·  +1 ▼", W / 2, fieldMidY() + 58, 14, "#ffffff", 2.2);
      fireworks(4 + tier * 2); haptic(2);
    }
    // 3단계부터는 레벨 시작 선물로 +3 공이 떨어진다
    if (tier >= 2) drops.push({ x: W / 2, y: TOP + ROWS * CELL + ITEM_R, kind: "plus3" });
  }
  // 공이 초록 칸을 깨면: 칸이 8px 이하일 땐 십자 모양으로 같이 깬다 (깨지는 면적 유지)
  function crack(i){
    breakCell(i);
    if (CELL > 8) return;
    const x = i % COLS;
    for (const j of [i - 1, i + 1, i - COLS, i + COLS]){
      if (j < 0 || j >= grid.length || grid[j] !== GREEN) continue;
      if ((j === i - 1 && x === 0) || (j === i + 1 && x === COLS - 1)) continue;
      breakCell(j);
    }
  }

  // ── 게임 흐름 ───────────────────────────────────────────
  const baseW = () => D.paddle;
  const speedUp = () => Math.min((level - 1) * 0.03, 0.45);   // 레벨마다 3%씩 조금씩, 16레벨에 45%로 최대
  const clearBonus = () => Math.round((1000 + level * 200) * scoreMul());
  const ballSpeed = () => D.speed * (1 + speedUp());

  function resetBall(){
    balls = [{ x: paddle.x, y: PADDLE_Y - BALL_R - 2, vx: 0, vy: 0, stuck: true }];
    drops = []; shots = [];
    sizeMul = 1; sizeT = 0; pierceT = 0; laserT = 0;
    combo = 0; comboT = 0; comboIdx = 0;
    if (strike){ missiles = Math.min(MISSILE_MAX, missiles + 1); strike = null; }   // 쏘던 미사일은 돌려준다
    state = "ready"; timer = 0; idleT = 0;
  }
  // startLevel을 주지 않으면 저장된 진행 레벨부터 시작한다
  function newGame(startLevel){
    game.diff = settings.diff; D = DIFF[game.diff];
    score = 0; level = startLevel || reachedOf(game.diff); lives = D.lives; assisted = settings.auto;
    missiles = 0; strike = null; fwQueue = []; pops = [];
    paddle.w = baseW(); paddle.x = paddle.target = W / 2;
    buildLevel(level); resetBall(); announceLevel();
    hidePanel();
  }
  function launch(){
    const b = balls[0];
    if (!b || !b.stuck) return;
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.5, s = ballSpeed();
    b.stuck = false; b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
    state = "play";
    blip(520, 0.07, "square", 0.05);
  }
  function loseLife(){
    lives--; shake = 9; redFlash = 0.35; missedThisLevel = true;
    blip(120, 0.35, "sawtooth", 0.06);
    pop("MISS", W / 2, fieldMidY(), 32, "#ff5a5f", 0.9);
    haptic(1);
    if (lives > 0){ resetBall(); return; }
    state = "over"; timer = 0;
    const isBest = !assisted && score > bestOf(game.diff);
    if (isBest) store.set("coredrill.best." + game.diff, score);
    if (!settings.auto) showPanel("over", isBest);
  }
  function levelClear(){
    // 남은 초록 칸은 아래에서 위로 쓸어 올리며 연쇄로 터뜨린다 (update의 clear 단계)
    sweep = [];
    for (let i = 0; i < grid.length; i++) if (grid[i] === GREEN) sweep.push(i);
    sweep.sort((a, b) => a - b);               // pop()이 가장 아래 칸부터 꺼낸다
    sweepRate = sweep.length / 0.9;
    // 빨리 끝낼수록 보너스가 커진다: 30초 안 ×3, 60초 안 ×2, 공을 안 놓쳤으면 노미스 보너스
    const speedMul = levelT < 30 ? 3 : levelT < 60 ? 2 : 1;
    const noMiss = missedThisLevel ? 0 : Math.round(500 * scoreMul());
    clearGain = clearBonus() * speedMul + noMiss;
    score += clearGain;
    drops = []; shots = [];
    state = "clear"; timer = 0; shake = 10 + speedMul * 4;
    const y0 = fieldMidY();
    pop(TIERS[tier].title, W / 2, y0 - 40, 30 + tier * 3, ["#ffd23f", "#3ec1d3", "#9b5de5", "#ff8c42", "#ff4fa3"][tier], 2.4);
    const t = Math.floor(levelT);
    pop("TIME " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"), W / 2, y0 - 8, 14, "#ffffff", 2.4);
    if (speedMul === 3) pop("LIGHTNING! ×3", W / 2, y0 + 20, 28, "#ffe066", 2.4);
    else if (speedMul === 2) pop("SPEED CLEAR! ×2", W / 2, y0 + 20, 22, "#3ec1d3", 2.4);
    if (noMiss) pop("NO MISS +" + noMiss.toLocaleString(), W / 2, y0 + 48, 14, "#6cc02f", 2.4);
    pop("+" + clearGain.toLocaleString(), W / 2, y0 + 74, 20, "#ffffff", 2.4);
    ring(W / 2, y0, "#ffd23f", 220);
    fanfare(speedMul > 1 ? [523, 659, 784, 1047, 1319, 1568, 2093] : [523, 659, 784, 1047, 1319], 80);
    fireworks(8 + tier * 4 + (speedMul === 3 ? 12 : speedMul === 2 ? 6 : 0));   // 단계가 높고 빠를수록 더 많이
    haptic(3 + (speedMul === 3 ? 1 : 0));
    // 번개 클리어: 위에서 금빛 색종이가 쏟아진다
    if (speedMul === 3) for (let j = 0; j < 120 && parts.length < 1200; j++){
      parts.push({ x: Math.random() * W, y: TOP - 10 - Math.random() * 60, vx: (Math.random() - .5) * 50, vy: 60 + Math.random() * 120,
        t: 0, life: 1.6 + Math.random(), c: j % 3 ? "#ffd23f" : "#ffffff", s: 3, g: 60 });
    }
    if (strike){ missiles = Math.min(MISSILE_MAX, missiles + 1); strike = null; }
  }

  // ── 벽돌 깨기와 아이템 ──────────────────────────────────
  function burst(i, n, power, colors){
    const x = (i % COLS) * CELL + CELL / 2, y = ((i / COLS) | 0) * CELL + TOP + CELL / 2;
    const v = power || 120;
    for (let j = 0; j < n; j++){
      parts.push({ x, y, vx:(Math.random() - .5) * v, vy:(Math.random() - .5) * v - 30, t:0, life:.3 + Math.random() * .4,
        c: colors ? colors[(Math.random() * colors.length) | 0] : (Math.random() < .3 ? pal.spark : pal.brick) });
    }
    if (flashes.length < 250) flashes.push({ x: x - CELL / 2, y: y - CELL / 2, t: 0 });
  }
  function breakCell(i){
    grid[i] = EMPTY; paintCell(i);
    // 박힌 아이템 자리까지 파고들었으면 풀려나 떨어진다
    const gem = gemOf.get(i);
    if (gem && !gem.taken){
      gem.taken = true;
      drops.push({ x: gem.x, y: TOP + gem.ly, kind: gem.kind });
      ring(gem.x, TOP + gem.ly, ITEMS[gem.kind].color, 50);
      pop("GET!", gem.x, TOP + gem.ly - 18, 16, ITEMS[gem.kind].color, 0.9);
      blip(1046, 0.08, "triangle", 0.05); blip(1568, 0.1, "triangle", 0.04);
      haptic(1);
    }
    broken++; score += Math.round(10 * scoreMul()); idleT = 0;
    if (parts.length < 500) burst(i, 3);
    // 콤보: 0.6초 안에 이어서 깨면 쌓이고, 단계마다 크게 알린다
    combo = comboT > 0 ? combo + 1 : 1; comboT = 0.6;
    if (comboIdx < COMBO_STEPS.length && combo >= COMBO_STEPS[comboIdx]){
      comboIdx++;
      const hot = ["#ffffff", "#ffd23f", "#ff8c42", "#ff5a5f", "#e040fb"][Math.min(comboIdx - 1, 4)];
      pop("COMBO " + combo + "!", W / 2, fieldMidY(), 24 + comboIdx * 4, hot, 1.0);
      shake = Math.max(shake, 3 + comboIdx * 1.5);
      fanfare([660, 880, 1320].slice(0, 1 + Math.min(comboIdx, 2)), 60);
      fireworks(Math.min(comboIdx, 5));
      haptic(1);
    }
    const prog = broken / (totalGreen * CLEAR_AT);
    if (milestone < 1 && prog >= 0.5){ milestone = 1; pop("HALF WAY!", W / 2, fieldMidY() + 40, 22, "#3ec1d3", 1.3); }
    if (milestone < 2 && prog >= 0.75){ milestone = 2; pop("75%!", W / 2, fieldMidY() + 40, 26, "#3ec1d3", 1.3); }
    const left = totalGreen - broken;
    if (milestone < 3 && left > 0 && left <= lastN()){ milestone = 3; pop("LAST " + left + "!", W / 2, fieldMidY() + 40, 26, "#ffffff", 1.3); haptic(1); }
    brickBlip();
    // 우연히 나오는 아이템은 줄였다(40%). 아이템은 주로 박힌 자리를 파고들어 얻는다
    if (Math.random() < D.drop * 0.4 * CELL * CELL / 144 && drops.length < 8){   // 면적당 확률은 해상도와 무관
      const r = Math.random();
      const kind = Math.random() < D.bad ? "shrink" : pickGood(r);
      drops.push({ x: (i % COLS) * CELL + CELL / 2, y: ((i / COLS) | 0) * CELL + TOP + CELL / 2, kind });
    }
  }
  // 좋은 아이템 비율. 무기 서열(레이저 < 관통 < 왕볼 < 벙커버스터)이 높을수록 드물다
  function pickGood(r){
    return r < 0.50 ? "plus3" : r < 0.63 ? "wide" : r < 0.77 ? "laser" : r < 0.87 ? "pierce" : r < 0.95 ? "mega" : "missile";
  }
  function applyItem(kind){
    const before = balls.length;
    if (kind === "plus3"){
      // 날아가는 공마다 그 자리에서 3개로 갈라져 부채꼴로 퍼진다 (왕볼에서는 보통 공이 갈라져 나온다)
      for (const b of balls.slice()){
        if (b.stuck) continue;
        const sp = Math.hypot(b.vx, b.vy), a0 = Math.atan2(b.vy, b.vx);
        for (const da of [-0.4, 0.4]){
          if (balls.length >= MAX_BALLS) break;
          balls.push({ x: b.x, y: b.y, vx: Math.cos(a0 + da) * sp, vy: Math.sin(a0 + da) * sp, stuck:false });
        }
        ring(b.x, b.y, ITEMS.plus3.color, 26);
      }
    }
    else if (kind === "wide"){ sizeMul = 1.5; sizeT = 12; }
    else if (kind === "shrink"){ sizeMul = 0.6; sizeT = 10; }
    else if (kind === "pierce"){ pierceT = 6; }
    else if (kind === "laser"){ laserT = 8; }
    else if (kind === "missile"){ missiles = Math.min(MISSILE_MAX, missiles + 1); haptic(1); }
    else if (kind === "mega" && balls.length < MAX_BALLS){
      const s = ballSpeed(), a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
      balls.push({ x: paddle.x, y: PADDLE_Y - MEGA_R - 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, stuck:false, mega: MEGA_TIME, r: MEGA_R });
      shake = Math.max(shake, 6); haptic(1);
    }
    const label = { plus3:"SPLIT!", laser:"LASER!", missile:"BUNKER BUSTER +1", mega:"MEGA BALL!", wide:"WIDE!", pierce:"PIERCE!", shrink:"SHRINK..." }[kind];
    pop(label, paddle.x, PADDLE_Y - 34, 16, ITEMS[kind].color, 0.9);
    ring(paddle.x, PADDLE_Y, ITEMS[kind].color, 70);
    for (const n of BALL_STEPS){
      if (kind === "plus3" && before < n && balls.length >= n){
        pop("×" + n + " BALLS!", W / 2, fieldMidY(), 30, "#1fb6d9", 1.3);
        shake = Math.max(shake, 6);
        fireworks(2); haptic(1);
      }
    }
    if (ITEMS[kind].good){ blip(660, 0.12, "triangle", 0.06); blip(990, 0.12, "triangle", 0.04); }
    else blip(180, 0.2, "sawtooth", 0.05);
  }

  // ── 벙커버스터 (최강 무기) ──────────────────────────────
  // 위에서 내리꽂혀 벽돌밭을 관통하며 파고든 뒤, 깊은 곳에서 지연 신관으로 터진다
  const AIM_T = 0.35, DIVE_T = 0.25, FUSE_T = 0.3;          // 조준 → 낙하 → 박힌 채 대기 → 폭발
  const BOOM_AT = AIM_T + DIVE_T + FUSE_T;

  // 부술 수 있는 칸이면 부순다 (바깥 테두리 벽은 남긴다)
  function smash(i, colors){
    const x = i % COLS, y = (i / COLS) | 0;
    if (x === 0 || x === COLS - 1 || y === 0) return false;
    if (grid[i] === GREEN){ breakCell(i); return false; }
    if (grid[i] !== WALL) return false;
    grid[i] = EMPTY; paintCell(i);
    if (parts.length < 900) burst(i, 3, 300, colors || ["#bdbdbd", "#8d8d8d", "#ffffff"]);
    return true;
  }
  function blast(x, y, rPx, big){
    const r = rPx / CELL;
    const cx = Math.floor(x / CELL), cy = Math.floor((y - TOP) / CELL), R = Math.ceil(r);
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){
      const xx = cx + dx, yy = cy + dy;
      if (xx < 0 || xx >= COLS || yy < 0 || yy >= ROWS || dx * dx + dy * dy > r * r) continue;
      smash(yy * COLS + xx);
    }
    const n = big ? 40 : 14;
    for (let j = 0; j < n && parts.length < 1000; j++){
      const a = Math.random() * Math.PI * 2, v = (big ? 160 : 90) + Math.random() * (big ? 300 : 160);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: .5 + Math.random() * .5,
        c: ["#ffffff", "#ffd23f", "#ff8c42", "#ff1744"][j % 4], s: 3 });
    }
    ring(x, y, "#ffd23f", rPx * 1.6);
    if (big){
      ring(x, y, "#ffffff", rPx * 2.6);
      ring(x, y, "#ff1744", rPx);
      shake = 22; boomFlash = 0.3; idleT = 0;
      blip(60, 0.9, "sawtooth", 0.16); blip(38, 1.1, "sine", 0.2);
      pop("BUNKER BUSTER!", W / 2, fieldMidY(), 28, "#ffc400", 1.6);
      fireworks(3, x, y);
      haptic(3);
    } else {
      shake = Math.max(shake, 8);
      blip(90, 0.4, "sawtooth", 0.08);
    }
  }
  // 남은 초록 칸이 가장 빽빽한 곳을 찾아 조준한다
  function fireMissile(){
    if (missiles <= 0 || strike || state !== "play") return;
    let best = -1, bx = W / 2, by = fieldMidY();
    const r = BLAST_PX / CELL, R = Math.ceil(r), step = Math.max(2, Math.round(24 / CELL));
    for (let cy = 2; cy < ROWS - 1; cy += step) for (let cx = 2; cx < COLS - 2; cx += step){
      let n = 0;
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){
        const x = cx + dx, y = cy + dy;
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS || dx * dx + dy * dy > r * r) continue;
        if (grid[y * COLS + x] === GREEN) n++;
      }
      if (n > best){ best = n; bx = (cx + 0.5) * CELL; by = TOP + (cy + 0.5) * CELL; }
    }
    missiles--;
    // 2차 폭발 네 곳: 주 폭발 둘레에 연달아
    const sec = [];
    for (let j = 0; j < 4; j++){
      const a = Math.random() * Math.PI * 2, d = BLAST_PX * (0.9 + Math.random() * 0.5);
      sec.push({ x: clamp(bx + Math.cos(a) * d, CELL * 2, W - CELL * 2), y: by + Math.sin(a) * d, at: BOOM_AT + 0.12 * (j + 1), done: false });
    }
    strike = { x: bx, y: by, t: 0, drilled: TOP, boomed: false, sec };
    for (let j = 0; j < 6; j++) setTimeout(() => blip(500 + j * 220, 0.06, "sine", 0.04), j * 55);
  }
  const missileY = s => (TOP - 60) + (s.y - TOP + 60) * Math.pow(clamp((s.t - AIM_T) / DIVE_T, 0, 1), 2);
  function updateStrike(dt){
    const s = strike;
    s.t += dt;
    // 관통: 미사일이 지나간 자리를 3칸 폭으로 뚫는다
    if (s.t > AIM_T){
      const my = missileY(s), cx = Math.floor(s.x / CELL);
      const fromRow = Math.max(0, Math.floor((s.drilled - TOP) / CELL));
      const toRow = Math.min(ROWS - 1, Math.floor((my - TOP) / CELL));
      const hw = Math.max(1, Math.floor(18 / CELL));   // 관통 폭 약 36px
      for (let y = fromRow; y <= toRow; y++) for (let dx = -hw; dx <= hw; dx++){
        const x = cx + dx;
        if (x >= 0 && x < COLS) smash(y * COLS + x, ["#ffd23f", "#ff8c42", "#ffffff"]);
      }
      if (my > s.drilled){ s.drilled = my; }
      if (s.t - dt <= AIM_T + DIVE_T && s.t > AIM_T + DIVE_T){ shake = Math.max(shake, 6); blip(140, 0.12, "square", 0.06); }
    }
    if (!s.boomed && s.t >= BOOM_AT){ s.boomed = true; blast(s.x, s.y, BLAST_PX, true); }
    for (const q of s.sec) if (!q.done && s.t >= q.at){ q.done = true; blast(q.x, q.y, SEC_PX, false); }
    if (s.t > BOOM_AT + 0.7) strike = null;
  }

  // ── 공 이동과 충돌 ──────────────────────────────────────
  function cellAt(px, py){
    const cx = Math.floor(px / CELL), cy = Math.floor((py - TOP) / CELL);
    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return -1;
    const i = cy * COLS + cx;
    return grid[i] === EMPTY ? -1 : i;
  }
  // 공의 앞쪽 가장자리 두 점을 검사해 튕길지 정한다
  function hits(b, x1, y1, x2, y2){
    let bounce = false;
    for (const [px, py] of [[x1, y1], [x2, y2]]){
      const i = cellAt(px, py);
      if (i < 0) continue;
      if (grid[i] === WALL) bounce = true;
      else { crack(i); b.idle = 0; if (pierceT <= 0) bounce = true; }
    }
    return bounce;
  }
  // 한동안 벽돌을 못 깬 공은 벽에 튕길 때 각도를 살짝 흔들어 갇힌 궤도에서 빼낸다
  function nudge(b){
    if ((b.idle || 0) < 4) return;
    const s = Math.hypot(b.vx, b.vy);
    let a = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 0.8;
    if (Math.abs(Math.sin(a)) < 0.35) a = Math.atan2(Math.sign(b.vy || 1) * 0.35, Math.sign(Math.cos(a)) * 0.94);
    b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
  }
  // 왕볼: 튕기지 않고 닿는 칸을 초록이든 벽이든 쓸어버린다 (바깥 테두리에서만 튕긴다)
  function megaStep(b, dt){
    const r = b.r;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const inField = b.y - r < TOP + ROWS * CELL;
    const lo = inField ? CELL + r : r, hi = W - lo;
    if (b.x < lo){ b.x = lo; b.vx = Math.abs(b.vx); }
    if (b.x > hi){ b.x = hi; b.vx = -Math.abs(b.vx); }
    if (b.y < TOP + CELL + r){ b.y = TOP + CELL + r; b.vy = Math.abs(b.vy); }
    const x0 = Math.floor((b.x - r) / CELL), x1 = Math.floor((b.x + r) / CELL);
    const y0 = Math.floor((b.y - r - TOP) / CELL), y1 = Math.floor((b.y + r - TOP) / CELL);
    for (let y = Math.max(0, y0); y <= Math.min(ROWS - 1, y1); y++){
      for (let x = Math.max(0, x0); x <= Math.min(COLS - 1, x1); x++){
        const i = y * COLS + x;
        if (grid[i] === EMPTY) continue;
        const dx = (x + 0.5) * CELL - b.x, dy = TOP + (y + 0.5) * CELL - b.y;
        if (dx * dx + dy * dy > (r + CELL * 0.35) ** 2) continue;
        if (smash(i, ["#ff4fa3", "#ffffff", "#bdbdbd"]) || grid[i] === EMPTY) b.idle = 0;
      }
    }
  }
  function stepBall(b, dt){
    const R = b.r || BALL_R;
    if (b.mega) megaStep(b, dt);
    else {
      const o = BALL_R * 0.7;
      const nx = b.x + b.vx * dt;
      if (b.vx){
        const ex = nx + Math.sign(b.vx) * BALL_R;
        if (hits(b, ex, b.y - o, ex, b.y + o)){ b.vx = -b.vx; nudge(b); } else b.x = nx;
      }
      const ny = b.y + b.vy * dt;
      const ey = ny + Math.sign(b.vy) * BALL_R;
      if (hits(b, b.x - o, ey, b.x + o, ey)){ b.vy = -b.vy; nudge(b); } else b.y = ny;

      if (b.x < BALL_R){ b.x = BALL_R; b.vx = Math.abs(b.vx); }
      if (b.x > W - BALL_R){ b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
      if (b.y < TOP + BALL_R){ b.y = TOP + BALL_R; b.vy = Math.abs(b.vy); }
    }

    const half = paddle.w / 2;
    if (b.vy > 0 && b.y + R >= PADDLE_Y && b.y - R <= PADDLE_Y + PADDLE_H
        && b.x >= paddle.x - half - R && b.x <= paddle.x + half + R){
      let off = clamp((b.x - paddle.x) / half, -1, 1);
      // 수직으로 튀면 벽 통로를 같은 길로 오르내리므로 최소 기울기를 둔다
      if (Math.abs(off) < 0.15) off = (off < 0 || (off === 0 && Math.random() < 0.5) ? -1 : 1) * 0.15;
      const a = -Math.PI / 2 + off * 1.05, s = ballSpeed();
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
      b.y = PADDLE_Y - R - 0.5;
      b.aim = null;
      blip(190, 0.04, "sine", 0.05);
    }
  }

  // ── 자동 진행 ───────────────────────────────────────────
  // 벽 반사를 고려해 공이 패들 높이에 닿을 x를 구한다
  function reflectX(x){
    const lo = BALL_R, span = W - 2 * BALL_R;
    let u = (x - lo) % (2 * span);
    if (u < 0) u += 2 * span;
    return lo + (u > span ? 2 * span - u : u);
  }
  // 아래에서 곧장 보이는 초록 칸이 있는 열 중 하나를 골라 그 x를 돌려준다
  function pickAim(){
    const cols = [];
    for (let x = 1; x < COLS - 1; x++){
      for (let y = ROWS - 1; y >= 0; y--){
        const v = grid[y * COLS + x];
        if (v === EMPTY) continue;
        if (v === GREEN) cols.push(x);
        break;
      }
    }
    return cols.length ? (cols[Math.floor(Math.random() * cols.length)] + 0.5) * CELL : Math.random() * W;
  }
  function autoControl(dt){
    const half = paddle.w / 2;
    let target = null, soon = Infinity;
    for (const b of balls){
      if (b.stuck || b.vy <= 0) continue;
      const t = (PADDLE_Y - (b.r || BALL_R) - b.y) / b.vy;
      if (t >= 0 && t < soon){ soon = t; target = b; }
    }
    let tx = paddle.target;
    if (target){
      const px = reflectX(target.x + target.vx * soon);
      // 고른 열을 향하는 반사 각도가 나오도록 패들 어디로 받을지 정한다
      if (target.aim == null) target.aim = pickAim();
      const rise = PADDLE_Y - (TOP + ROWS * CELL);
      const off = clamp(Math.atan2(target.aim - px, rise) / 1.05, -0.85, 0.85);
      tx = px - off * half;
    }
    // 급한 공이 없으면 좋은 아이템을 받으러 간다
    if (!target || soon > 0.9){
      let item = null;
      for (const d of drops) if (ITEMS[d.kind].good && d.y < PADDLE_Y && (!item || d.y > item.y)) item = d;
      if (item && (!target || (PADDLE_Y - item.y) / ITEM_SPEED < soon - 0.3)) tx = item.x;
    }
    // 나쁜 아이템이 곧 떨어질 자리라면 비켜선다
    for (const d of drops){
      if (ITEMS[d.kind].good) continue;
      const t = (PADDLE_Y - d.y) / ITEM_SPEED;
      if (t > 0 && t < 0.5 && Math.abs(d.x - tx) < half + ITEM_R && (!target || soon > t + 0.25)){
        tx = d.x + (tx >= d.x ? 1 : -1) * (half + ITEM_R + 4);
      }
    }
    paddle.target = clamp(tx, half, W - half);
    paddle.x += clamp(paddle.target - paddle.x, -AUTO_SPEED * dt, AUTO_SPEED * dt);
  }

  // ── 업데이트 ────────────────────────────────────────────
  function update(dt){
    if (shake > 0) shake = Math.max(0, shake - dt * 28);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.t += dt; p.vy += (p.g || 520) * dt;
      if (p.drag){ const f = Math.pow(0.2, dt); p.vx *= f; p.vy *= f; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t >= p.life) parts.splice(i, 1);
    }

    // 연출 시간
    if (redFlash > 0) redFlash = Math.max(0, redFlash - dt);
    if (boomFlash > 0) boomFlash = Math.max(0, boomFlash - dt);
    if (comboT > 0 && (comboT -= dt) <= 0){ combo = 0; comboIdx = 0; }
    for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].t += dt) >= pops[i].life) pops.splice(i, 1);
    for (let i = rings.length - 1; i >= 0; i--) if ((rings[i].t += dt) >= 0.5) rings.splice(i, 1);
    for (let i = flashes.length - 1; i >= 0; i--) if ((flashes[i].t += dt) >= 0.15) flashes.splice(i, 1);
    for (let i = fwQueue.length - 1; i >= 0; i--){
      const q = fwQueue[i];
      if ((q.at -= dt) <= 0){ spawnFirework(q.x, q.y); fwQueue.splice(i, 1); }
    }

    if (state === "clear"){
      // 아래에서 위로 연쇄 폭발, 위에서는 색종이
      let n = Math.ceil(sweepRate * dt), swept = false;
      while (n-- > 0 && sweep.length){
        const i = sweep.pop();
        grid[i] = EMPTY; paintCell(i); score += Math.round(10 * scoreMul()); swept = true;
        if (parts.length < 900) burst(i, 3, 260, CONFETTI);
      }
      if (swept && Math.random() < 0.5) blip(500 + Math.random() * 700, 0.04, "square", 0.02);
      if (timer < 1.2 && parts.length < 900){
        for (let j = 0; j < 4; j++){
          parts.push({ x: Math.random() * W, y: TOP - 4, vx: (Math.random() - .5) * 60, vy: 40 + Math.random() * 80,
            t: 0, life: 1 + Math.random() * .8, c: CONFETTI[(Math.random() * CONFETTI.length) | 0], s: 3 });
        }
      }
      if ((timer += dt) > 2.4){
        level++;
        store.set("coredrill.level." + game.diff, Math.max(reachedOf(game.diff), level));   // 클리어한 레벨은 인정한다
        buildLevel(level); resetBall(); announceLevel();
      }
      return;
    }
    if (state === "over"){
      if (settings.auto && (timer += dt) > 2.5) newGame();
      return;
    }
    if (state !== "play" && state !== "ready") return;

    // 아이템 효과 시간
    if (sizeT > 0 && (sizeT -= dt) <= 0) sizeMul = 1;
    if (pierceT > 0) pierceT -= dt;
    paddle.w += (baseW() * sizeMul - paddle.w) * Math.min(1, dt * 10);

    // 패들
    const half = paddle.w / 2;
    if (settings.auto) autoControl(dt);
    else {
      if (keyL) paddle.target -= 460 * dt;
      if (keyR) paddle.target += 460 * dt;
      paddle.target = clamp(paddle.target, half, W - half);
      paddle.x += (paddle.target - paddle.x) * Math.min(1, dt * 24);
    }
    paddle.x = clamp(paddle.x, half, W - half);

    if (state === "ready"){
      balls[0].x = paddle.x; balls[0].y = PADDLE_Y - BALL_R - 2;
      if (settings.auto && (timer += dt) > 0.6) launch();
      return;
    }

    // 러시: 2분이 지나면 3초마다, 2분 30초가 지나면 1.5초마다 강한 무기가 떨어진다
    levelT += dt;
    if (rush < 1 && levelT > RUSH_AT){
      rush = 1; missiles = Math.min(MISSILE_MAX, missiles + 1);
      pop("RUSH TIME!", W / 2, fieldMidY(), 32, "#ffc400", 1.8);
      shake = Math.max(shake, 10); fireworks(3); haptic(2);
      fanfare([392, 523, 659, 784], 80);
    }
    if (rush < 2 && levelT > FINAL_AT){
      rush = 2; missiles = MISSILE_MAX;
      pop("FINAL BLAST!", W / 2, fieldMidY(), 34, "#ff1744", 1.8);
      shake = Math.max(shake, 14); fireworks(5); haptic(3);
      fanfare([523, 659, 784, 1047], 70);
    }
    if (rush && (rushT -= dt) <= 0){
      rushT = rush === 1 ? 3 : 1.5;
      const kinds = ["mega", "laser", "missile", "mega", "plus3"];
      drops.push({ x: 30 + Math.random() * (W - 60), y: TOP + ROWS * CELL + ITEM_R, kind: kinds[(Math.random() * kinds.length) | 0] });
    }

    // 벙커버스터 진행, 자동 진행은 막히거나 꽉 차면 쏜다
    if (strike) updateStrike(dt);
    if (settings.auto && missiles > 0 && !strike && (idleT > 5 || missiles >= MISSILE_MAX)) fireMissile();

    // 레이저: 패들 양 끝에서 자동으로 쏘고, 총알은 처음 닿는 칸에서 사라진다
    if (laserT > 0){
      laserT -= dt;
      if ((shotT -= dt) <= 0){
        shotT = SHOT_GAP;
        const ex = paddle.w / 2 - 4;
        shots.push({ x: paddle.x - ex, y: PADDLE_Y - 2 }, { x: paddle.x + ex, y: PADDLE_Y - 2 });
        blip(880, 0.02, "square", 0.015);
      }
    }
    for (let i = shots.length - 1; i >= 0; i--){
      const s = shots[i];
      let gone = false;
      for (let k2 = 0; k2 < 2 && !gone; k2++){
        s.y -= SHOT_SPEED * dt / 2;
        const c = cellAt(s.x, s.y);
        if (c >= 0){ if (grid[c] === GREEN) breakCell(c); gone = true; }
        else if (s.y < TOP) gone = true;
      }
      if (gone) shots.splice(i, 1);
    }

    // 막판 도움: 마지막 몇 칸을 8초 동안 못 깨면 벙커버스터를 준다 (남은 칸 쪽으로 자동 조준된다)
    const leftNow = totalGreen - broken;
    if (leftNow > 0 && leftNow <= lastN() && idleT > 8){
      idleT = 0;
      missiles = Math.min(MISSILE_MAX, missiles + 1);
      pop("FINISHER +1 ▼", W / 2, fieldMidY() + 40, 18, "#ffc400", 1.4);
      haptic(1);
    }

    // 12초 동안 못 깨면 도움으로 +3 아이템을 떨어뜨린다
    if ((idleT += dt) > 12){
      idleT = 0;
      drops.push({ x: 30 + Math.random() * (W - 60), y: TOP + ROWS * CELL + ITEM_R, kind: "plus3" });
    }

    // 떨어지는 아이템
    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.y += ITEM_SPEED * dt;
      if (d.y + ITEM_R >= PADDLE_Y && d.y - ITEM_R <= PADDLE_Y + PADDLE_H && Math.abs(d.x - paddle.x) < half + ITEM_R){
        applyItem(d.kind); drops.splice(i, 1);
      } else if (d.y > H + ITEM_R) drops.splice(i, 1);
    }

    // 공 (빠른 공이 칸을 건너뛰지 않게 3px씩 나눠 움직인다)
    for (let i = balls.length - 1; i >= 0; i--){
      const b = balls[i];
      b.idle = (b.idle || 0) + dt;
      if (b.mega && (b.mega -= dt) <= 0){ b.mega = 0; b.r = 0; }   // 시간이 다 된 왕볼은 보통 공으로
      const steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 3));
      for (let s = 0; s < steps; s++) stepBall(b, dt / steps);
      if (b.y > H + BALL_R * 2) balls.splice(i, 1);
    }
    if (broken >= totalGreen * CLEAR_AT){ levelClear(); return; }
    if (balls.length === 0) loseLife();
  }

  // ── 그리기 ──────────────────────────────────────────────
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath(); ctx.fill();
  }
  function banner(title, sub){
    const y = TOP + ROWS * CELL + (PADDLE_Y - TOP - ROWS * CELL) / 2;
    ctx.fillStyle = "rgba(12,12,12,.78)";
    ctx.fillRect(0, y - 42, W, 84);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f2f2f2";
    ctx.font = '20px Silkscreen, ui-monospace, monospace';
    ctx.fillText(title, W / 2, y - 2);
    ctx.fillStyle = COL.dim;
    ctx.font = '13px -apple-system, system-ui, sans-serif';
    ctx.fillText(sub, W / 2, y + 24);
    ctx.textAlign = "left";
  }
  function drawItem(d){
    ctx.fillStyle = ITEMS[d.kind].color;
    ctx.beginPath(); ctx.arc(d.x, d.y, ITEM_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    if (d.kind === "plus3" || d.kind === "wide"){
      ctx.textAlign = "center";
      ctx.font = '700 10px -apple-system, system-ui, sans-serif';
      ctx.fillText(d.kind === "plus3" ? "+3" : "«»", d.x, d.y + 3.5);
      ctx.textAlign = "left";
    }
    else if (d.kind === "shrink") ctx.fillRect(d.x - 5, d.y - 1.5, 10, 3);
    else if (d.kind === "laser"){ ctx.fillRect(d.x - 4.5, d.y - 5, 2.5, 10); ctx.fillRect(d.x + 2, d.y - 5, 2.5, 10); }
    else if (d.kind === "missile"){
      ctx.fillStyle = "#1b1b1b";
      ctx.beginPath(); ctx.moveTo(d.x - 5.5, d.y - 4); ctx.lineTo(d.x + 5.5, d.y - 4); ctx.lineTo(d.x, d.y + 6); ctx.closePath(); ctx.fill();
    }
    else if (d.kind === "mega"){ ctx.beginPath(); ctx.arc(d.x, d.y, 5.5, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = "#7a3d78"; ctx.fillRect(d.x - 1.5, d.y - 5.5, 3, 11); }
  }

  function draw(){
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    ctx.fillStyle = COL.bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.drawImage(field, 0, TOP, W, ROWS * CELL);

    // 깨진 칸이 잠깐 하얗게 번쩍인다
    ctx.fillStyle = "#ffffff";
    for (const f of flashes){
      ctx.globalAlpha = 0.85 * (1 - f.t / 0.15);
      ctx.fillRect(f.x, f.y, CELL, CELL);
    }
    ctx.globalAlpha = 1;

    // 막판: 남은 초록 칸이 하얗게 깜빡여 어디가 남았는지 보인다
    const left = totalGreen - broken;
    if ((state === "play" || state === "ready") && left > 0 && left <= lastN()){
      ctx.strokeStyle = "rgba(255,255,255," + (0.45 + 0.45 * Math.sin(performance.now() / 120)) + ")";
      ctx.lineWidth = 1.5;
      for (let i = 0; i < grid.length; i++){
        if (grid[i] === GREEN) ctx.strokeRect((i % COLS) * CELL + 0.75, TOP + ((i / COLS) | 0) * CELL + 0.75, CELL - 1.5, CELL - 1.5);
      }
      ctx.lineWidth = 1;
    }

    for (const d of drops) drawItem(d);

    for (const p of parts){
      const s = p.s || 2;
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c || COL.green;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    // 공은 한 번에 채운다
    ctx.fillStyle = pierceT > 0 ? COL.pierce : COL.ball;
    ctx.beginPath();
    for (const b of balls){ if (!b.mega){ ctx.moveTo(b.x + BALL_R, b.y); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); } }
    ctx.fill();
    // 왕볼: 분홍 빛무리 + 흰 몸통, 끝나기 2초 전부터 깜빡인다
    for (const b of balls){
      if (!b.mega || (b.mega < 2 && Math.floor(b.mega * 8) % 2)) continue;
      const glow = ctx.createRadialGradient(b.x, b.y, b.r * 0.6, b.x, b.y, b.r * 1.9);
      glow.addColorStop(0, "rgba(255,79,163,.55)"); glow.addColorStop(1, "rgba(255,79,163,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ff4fa3"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1.5, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }

    // 레이저 총알
    ctx.fillStyle = ITEMS.laser.color;
    for (const s of shots) ctx.fillRect(s.x - 1, s.y - 8, 2, 8);

    // 패들 (레이저 중이면 양 끝에 포신)
    ctx.fillStyle = COL.paddle;
    ctx.fillRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H);
    if (laserT > 0){
      ctx.fillStyle = ITEMS.laser.color;
      const ex = paddle.w / 2 - 4;
      ctx.fillRect(paddle.x - ex - 2, PADDLE_Y - 5, 4, 5);
      ctx.fillRect(paddle.x + ex - 2, PADDLE_Y - 5, 4, 5);
    }

    // 벙커버스터: 조준경이 깜빡이고, 미사일이 내리꽂혀 박힌 채 깜빡이다가 터진다
    if (strike && strike.t < BOOM_AT){
      const r = BLAST_PX, blink = Math.floor(strike.t * (strike.t > AIM_T + DIVE_T ? 24 : 12)) % 2;
      ctx.strokeStyle = blink ? "#ff1744" : "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(strike.x, strike.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(strike.x - r - 8, strike.y); ctx.lineTo(strike.x + r + 8, strike.y);
      ctx.moveTo(strike.x, strike.y - r - 8); ctx.lineTo(strike.x, strike.y + r + 8);
      ctx.stroke();
      ctx.lineWidth = 1;
      if (strike.t > AIM_T){
        const my = missileY(strike);
        if (strike.t < AIM_T + DIVE_T){
          const grad = ctx.createLinearGradient(0, my - 110, 0, my);
          grad.addColorStop(0, "rgba(255,140,40,0)"); grad.addColorStop(1, "rgba(255,210,90,.95)");
          ctx.fillStyle = grad; ctx.fillRect(strike.x - 4, my - 110, 8, 110);
        }
        ctx.fillStyle = "#eceff1"; ctx.fillRect(strike.x - 4, my - 20, 8, 20);
        ctx.fillStyle = "#455a64"; ctx.fillRect(strike.x - 7, my - 22, 14, 4);
        ctx.fillStyle = blink ? "#ff1744" : "#ffd23f"; ctx.fillRect(strike.x - 4, my, 8, 5);
      }
    }

    // 퍼지는 링
    for (const g of rings){
      const q = g.t / 0.5;
      ctx.globalAlpha = 1 - q;
      ctx.strokeStyle = g.color; ctx.lineWidth = 3 * (1 - q) + 1;
      ctx.beginPath(); ctx.arc(g.x, g.y, 8 + g.max * q, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;

    // 튀어나오는 글자 (크게 튀었다가 제자리, 떠오르며 사라짐)
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    for (const p of pops){
      const a = p.t / 0.18;
      const sc = a < 1 ? 0.4 + 0.8 * a : 1 + 0.2 * Math.max(0, 1 - (p.t - 0.18) / 0.12);
      ctx.globalAlpha = Math.min(1, (p.life - p.t) / 0.3);
      ctx.save();
      ctx.translate(p.x, p.y - p.t * 18);
      ctx.scale(sc, sc);
      ctx.font = p.size + 'px Silkscreen, ui-monospace, monospace';
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.75)";
      ctx.strokeText(p.text, 0, p.size * 0.35);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, p.size * 0.35);
      ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1; ctx.textAlign = "left";

    // 진행 바
    const by = H - safeBot - 14, bw = W - 28;
    const prog = clamp(broken / (totalGreen * CLEAR_AT), 0, 1);
    ctx.fillStyle = COL.track; roundRect(14, by, bw, 4, 2);
    // 러시 중에는 진행 바가 금색·빨간색으로 깜빡인다
    const barCol = rush ? (Math.floor(performance.now() / 150) % 2 ? "#ffc400" : COL.bar) : COL.bar;
    if (prog > 0){ ctx.fillStyle = barCol; roundRect(14, by, Math.max(4, bw * prog), 4, 2); }
    if ((state === "play" || state === "ready") && left > 0 && left <= lastN()){
      ctx.fillStyle = "#ffffff"; ctx.textAlign = "right";
      ctx.font = '11px Silkscreen, ui-monospace, monospace';
      ctx.fillText("LAST " + left, W - 14, by - 6);
      ctx.textAlign = "left";
    }

    if (state === "ready" && !settings.auto) banner("LEVEL " + level, "화면을 눌러 발사 · 끌어서 이동");
    else if (state === "clear") banner("LEVEL " + level + " " + TIERS[tier].title, "+" + clearGain.toLocaleString() + " 보너스");
    else if (state === "over" && settings.auto) banner("GAME OVER", "잠시 후 다시 시작해요");

    // 화면 전체 번쩍임: 착탄은 흰색, 공을 놓치면 빨간색
    if (boomFlash > 0){ ctx.fillStyle = "rgba(255,255,255," + (boomFlash / 0.3 * 0.7) + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }
    if (redFlash > 0){ ctx.fillStyle = "rgba(255,40,60," + (redFlash / 0.35 * 0.35) + ")"; ctx.fillRect(-20, -20, W + 40, H + 40); }
  }

  // ── HUD ─────────────────────────────────────────────────
  let hudKey = "";
  function syncHud(){
    const key = [score, level, balls.length, lives, D.lives, settings.auto, missiles].join("|");
    if (key === hudKey) return;
    hudKey = key;
    $("score").textContent = score.toLocaleString();
    $("level").textContent = level;
    $("ballCount").textContent = balls.length;
    $("autoBtn").classList.toggle("on", settings.auto);
    $("autoBtn").textContent = settings.auto ? "AUTO" : "MANUAL";
    $("autoBtn").setAttribute("aria-pressed", String(settings.auto));
    $("missileBtn").hidden = missiles === 0;
    $("missileCount").textContent = missiles;
    const el = $("lives");
    el.innerHTML = "";
    for (let i = 0; i < Math.max(D.lives, lives); i++){   // 보상으로 기본보다 많아질 수 있다
      const d = document.createElement("i");
      if (i >= lives) d.className = "out";
      el.appendChild(d);
    }
  }

  // ── 메뉴 패널 ───────────────────────────────────────────
  let panelMode = "menu";
  function renderPanel(){
    for (const b of $("diffSeg").children) b.setAttribute("aria-pressed", String(b.dataset.d === settings.diff));
    $("autoSw").setAttribute("aria-checked", String(settings.auto));
    $("soundSw").setAttribute("aria-checked", String(settings.sound));
    $("hapticSw2").setAttribute("aria-checked", String(settings.haptic));
    $("diffNote").textContent = panelMode === "pause" && settings.diff !== game.diff ? "새 게임부터 적용" : "";
    $("bestLine").textContent = "최고 기록 (" + DIFF[settings.diff].name + ") " + bestOf(settings.diff).toLocaleString();
    // 버튼: 저장된 진행이 있으면 그 레벨부터 이어하기, 아래에 1레벨부터
    const lv = reachedOf(settings.diff), primary = $("primaryBtn"), secondary = $("secondaryBtn");
    if (panelMode === "pause"){
      primary.textContent = "계속";
      secondary.textContent = "LV " + lv + "부터 새로"; secondary.hidden = false;
    } else {
      primary.textContent = lv > 1 ? "LV " + lv + "부터 이어하기" : panelMode === "menu" ? "시작" : "다시 하기";
      secondary.textContent = "1레벨부터"; secondary.hidden = lv <= 1;
    }
  }
  function showPanel(mode, isBest){
    panelMode = mode;
    const sub = $("panelSub");
    if (mode === "menu") sub.textContent = "공으로 초록 벽돌밭을 갉아먹어요";
    else if (mode === "pause") sub.textContent = "일시정지";
    else sub.textContent = (isBest ? "최고 기록! " : "게임 오버 · ") + score.toLocaleString() + "점";
    renderPanel();
    $("panel").classList.add("show");
  }
  function hidePanel(){ $("panel").classList.remove("show"); }

  function pause(){
    if (state !== "play" && state !== "ready" && state !== "clear") return;
    resumeTo = state; state = "pause";
    showPanel("pause");
  }
  function resume(){
    if (state !== "pause") return;
    state = resumeTo; pausedByHide = false;
    hidePanel();
  }

  $("diffSeg").addEventListener("click", ev => {
    const d = ev.target.closest("button")?.dataset.d;
    if (!d) return;
    settings.diff = d; saveSettings(); renderPanel();
  });
  // 수동·자동 전환: 수동으로 넘어올 땐 패들이 튀지 않게 지금 자리에서 이어받는다
  function setAuto(on, announce){
    settings.auto = on; saveSettings(); renderPanel();
    if (on && state !== "menu") assisted = true;
    if (!on){ paddle.target = paddle.x; drag = null; }
    if (announce){
      pop(on ? "AUTO ON" : "MANUAL", W / 2, PADDLE_Y - 60, 20, on ? "#8fe08f" : "#ffffff", 0.9);
      haptic(1); blip(on ? 880 : 520, 0.08, "triangle", 0.05);
    }
    // 자동으로 게임 오버를 기다리던 중 수동으로 바꾸면 다시 하기 화면을 띄운다
    if (!on && state === "over") showPanel("over", false);
  }
  $("autoSw").addEventListener("click", () => setAuto(!settings.auto, false));
  $("autoBtn").addEventListener("click", () => { audio(); setAuto(!settings.auto, true); });
  $("soundSw").addEventListener("click", () => {
    settings.sound = !settings.sound; saveSettings(); renderPanel();
    if (settings.sound) audio();
  });
  $("primaryBtn").addEventListener("click", () => {
    audio();
    if (panelMode === "pause") resume(); else newGame();          // 저장된 레벨부터
  });
  $("secondaryBtn").addEventListener("click", () => { audio(); panelMode === "pause" ? newGame() : newGame(1); });
  $("pauseBtn").addEventListener("click", () => { audio(); pause(); });
  $("missileBtn").addEventListener("click", () => { audio(); fireMissile(); });
  $("hapticSw2").addEventListener("click", () => {
    settings.haptic = !settings.haptic; saveSettings(); renderPanel();
    if (settings.haptic) haptic(1);
  });

  // ── 입력: 화면 아무 곳이나 끌어서 패들을 움직인다 ───────
  let drag = null;
  const localX = ev => (ev.clientX - stage.getBoundingClientRect().left) / stage.clientWidth * W;
  stage.addEventListener("pointerdown", ev => {
    if (ev.target.closest("button, .panel")) return;
    audio();
    if (settings.auto) return;
    drag = { id: ev.pointerId, sx: localX(ev), px: paddle.target };
    stage.setPointerCapture?.(ev.pointerId);
    if (state === "ready") launch();
  });
  stage.addEventListener("pointermove", ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    paddle.target = drag.px + (localX(ev) - drag.sx) * 1.15;
  });
  const endDrag = ev => { if (drag && ev.pointerId === drag.id) drag = null; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  document.addEventListener("gesturestart", ev => ev.preventDefault());

  addEventListener("keydown", ev => {
    const key = ev.key.toLowerCase();
    if (key === "arrowleft") keyL = true;
    if (key === "arrowright") keyR = true;
    if (ev.code === "Space"){ ev.preventDefault(); audio(); if (state === "ready" && !settings.auto) launch(); }
    if (key === "p" || key === "escape") state === "pause" ? resume() : pause();
  });
  addEventListener("keyup", ev => {
    const key = ev.key.toLowerCase();
    if (key === "arrowleft") keyL = false;
    if (key === "arrowright") keyR = false;
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      if (state === "play" || state === "ready"){ pause(); pausedByHide = true; }
    } else if (pausedByHide && settings.auto) resume();
  });

  // ── 화면 켜짐 유지: 게임이 진행 중일 때만 화면이 어두워지거나 잠기지 않게 한다 ──
  let wakeLock = null, wakePending = false, wakeRetryAt = 0;
  function syncWakeLock(now){
    const want = !document.hidden && (state === "play" || state === "ready" || state === "clear" || (state === "over" && settings.auto));
    if (want && !wakeLock && !wakePending && now >= wakeRetryAt && navigator.wakeLock){
      wakePending = true;
      navigator.wakeLock.request("screen").then(lock => {
        wakeLock = lock;
        lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
      }).catch(() => { wakeRetryAt = performance.now() + 3000; })
        .finally(() => { wakePending = false; });
    }
    else if (!want && wakeLock){
      const lock = wakeLock; wakeLock = null;
      lock.release().catch(() => {});
    }
  }

  // ── 루프 ────────────────────────────────────────────────
  let last = performance.now();
  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (state !== "pause" && state !== "menu") update(dt);
    draw();
    syncHud();
    syncWakeLock(now);
    requestAnimationFrame(frame);
  }

  addEventListener("resize", layout);
  layout();
  buildLevel(1);
  balls = [];
  showPanel("menu");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
